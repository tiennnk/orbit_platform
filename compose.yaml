services:
  db:
    image: postgres:17
    command: ["postgres", "-c", "random_page_cost=1.1"]
    environment:
      POSTGRES_DB: orbit_platform
      POSTGRES_USER: orbit_admin
      POSTGRES_PASSWORD: orbit_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
