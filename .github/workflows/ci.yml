name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: orbit_platform
          POSTGRES_USER: orbit_admin
          POSTGRES_PASSWORD: orbit_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit_admin -d orbit_platform"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"

      - run: uv sync --frozen

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - run: uv run python manage.py makemigrations --check --dry-run

      - run: uv run pytest -q
