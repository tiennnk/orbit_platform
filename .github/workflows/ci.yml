name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: orbit_platform
          POSTGRES_USER: orbit_admin
          POSTGRES_PASSWORD: orbit_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit_admin -d orbit_platform"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          working-directory: backend

      - run: uv sync --frozen

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - run: uv run python manage.py makemigrations --check --dry-run

      - run: uv run python manage.py spectacular --validate --fail-on-warn --file openapi.yaml

      - run: git diff --exit-code openapi.yaml

      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build
