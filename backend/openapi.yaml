openapi: 3.0.3
info:
  title: Orbit API
  version: 1.0.0
paths:
  /api/v1/auth/login/:
    post:
      operationId: login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: logout
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: getMe
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: register
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/drivers/:
    get:
      operationId: listDrivers
      parameters:
      - in: query
        name: approval_status
        schema:
          enum:
          - pending
          - approved
          - rejected
          - suspended
          type: string
          minLength: 1
        description: |-
          * `pending` - Pending
          * `approved` - Approved
          * `rejected` - Rejected
          * `suspended` - Suspended
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - admin
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDriverList'
          description: ''
    post:
      operationId: registerDriver
      tags:
      - drivers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DriverCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DriverCreateRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/drivers/{id}/:
    get:
      operationId: getDriver
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/drivers/{id}/approve/:
    post:
      operationId: approveDriver
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/drivers/{id}/reinstate/:
    post:
      operationId: reinstateDriver
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/drivers/{id}/reject/:
    post:
      operationId: rejectDriver
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/drivers/{id}/suspend/:
    post:
      operationId: suspendDriver
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/drivers/me/:
    get:
      operationId: getMyDriver
      tags:
      - drivers
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    put:
      operationId: updateMyDriver
      tags:
      - drivers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DriverProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DriverProfileUpdateRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/drivers/me/location/:
    put:
      operationId: updateMyLocation
      tags:
      - drivers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LocationUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LocationUpdateRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverLocation'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/drivers/me/offline/:
    post:
      operationId: goOffline
      tags:
      - drivers
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/drivers/me/online/:
    post:
      operationId: goOnline
      tags:
      - drivers
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/drivers/nearby/:
    get:
      operationId: findNearbyDrivers
      parameters:
      - in: query
        name: latitude
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
        required: true
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 10
      - in: query
        name: longitude
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
        required: true
      - in: query
        name: radius_km
        schema:
          type: number
          format: double
          maximum: 20
          minimum: 0.1
          default: 3.0
      tags:
      - admin
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NearbyDriver'
          description: ''
  /api/v1/rides/:
    post:
      operationId: requestRide
      tags:
      - rides
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RideCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RideCreateRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/rides/{id}/:
    get:
      operationId: getRide
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - rides
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/rides/{id}/cancel/:
    post:
      operationId: cancelRide
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - rides
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/rides/{id}/complete/:
    post:
      operationId: completeRide
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - rides
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/rides/{id}/start/:
    post:
      operationId: startRide
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - rides
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/rides/current/:
    get:
      operationId: getCurrentRide
      tags:
      - rides
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/rides/history/:
    get:
      operationId: listRideHistory
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          enum:
          - rider
          - driver
          type: string
          default: rider
          minLength: 1
        description: |-
          * `rider` - Rider
          * `driver` - Driver
      tags:
      - rides
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRideList'
          description: ''
  /health/:
    get:
      operationId: health
      tags:
      - system
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
components:
  schemas:
    ApprovalStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - suspended
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
        * `suspended` - Suspended
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - token
      - user
    AvailabilityEnum:
      enum:
      - available
      - on_trip
      type: string
      description: |-
        * `available` - Available
        * `on_trip` - On Trip
    Driver:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        approval_status:
          allOf:
          - $ref: '#/components/schemas/ApprovalStatusEnum'
          readOnly: true
        is_online:
          type: boolean
          readOnly: true
        availability:
          allOf:
          - $ref: '#/components/schemas/AvailabilityEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approval_status
      - availability
      - created_at
      - full_name
      - id
      - is_online
      - phone
    DriverCreateRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        phone:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - full_name
      - phone
    DriverLocation:
      type: object
      properties:
        latitude:
          type: number
          format: double
          readOnly: true
        longitude:
          type: number
          format: double
          readOnly: true
        recorded_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - latitude
      - longitude
      - recorded_at
      - updated_at
    DriverProfileUpdateRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        phone:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - full_name
      - phone
    Error:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    LocationUpdateRequest:
      type: object
      properties:
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
        recorded_at:
          type: string
          format: date-time
      required:
      - latitude
      - longitude
      - recorded_at
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    NearbyDriver:
      type: object
      properties:
        driver_id:
          type: integer
        full_name:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        distance_km:
          type: number
          format: double
      required:
      - distance_km
      - driver_id
      - full_name
      - latitude
      - longitude
    PaginatedDriverList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Driver'
    PaginatedRideList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Ride'
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    Ride:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/RideStatusEnum'
          readOnly: true
          default: assigned
        rider_id:
          type: integer
          readOnly: true
        driver:
          $ref: '#/components/schemas/RideDriver'
        pickup_latitude:
          type: number
          format: double
          readOnly: true
        pickup_longitude:
          type: number
          format: double
          readOnly: true
        dropoff_latitude:
          type: number
          format: double
          readOnly: true
        dropoff_longitude:
          type: number
          format: double
          readOnly: true
        estimated_distance_km:
          type: number
          format: double
          readOnly: true
        estimated_fare:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - cancelled_at
      - completed_at
      - created_at
      - driver
      - dropoff_latitude
      - dropoff_longitude
      - estimated_distance_km
      - estimated_fare
      - id
      - pickup_latitude
      - pickup_longitude
      - rider_id
      - started_at
      - status
    RideCreateRequest:
      type: object
      properties:
        pickup_latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        pickup_longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
        dropoff_latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        dropoff_longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
      required:
      - dropoff_latitude
      - dropoff_longitude
      - pickup_latitude
      - pickup_longitude
    RideDriver:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        phone:
          type: string
      required:
      - full_name
      - id
      - phone
    RideStatusEnum:
      enum:
      - assigned
      - in_progress
      - completed
      - cancelled
      type: string
      description: |-
        * `assigned` - Assigned
        * `in_progress` - In Progress
        * `completed` - Completed
        * `cancelled` - Cancelled
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
