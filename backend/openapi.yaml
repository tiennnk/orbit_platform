components:
  schemas:
    ApprovalStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - suspended
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
        * `suspended` - Suspended
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - token
      - user
    AvailabilityEnum:
      enum:
      - available
      - on_trip
      type: string
      description: |-
        * `available` - Available
        * `on_trip` - On Trip
    ChatReply:
      type: object
      properties:
        reply:
          type: string
      required:
      - reply
    ChatRequestRequest:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatTurnRequest'
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
      required:
      - messages
    ChatTurnRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
        content:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - content
      - role
    DeliveryQuote:
      type: object
      properties:
        distance_km:
          type: number
          format: double
        delivery_fee:
          type: integer
        deliverable:
          type: boolean
      required:
      - deliverable
      - delivery_fee
      - distance_km
    Driver:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        approval_status:
          allOf:
          - $ref: '#/components/schemas/ApprovalStatusEnum'
          readOnly: true
        is_online:
          type: boolean
          readOnly: true
        availability:
          allOf:
          - $ref: '#/components/schemas/AvailabilityEnum'
          readOnly: true
        rating_average:
          type: number
          format: double
          readOnly: true
          nullable: true
        rating_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approval_status
      - availability
      - created_at
      - full_name
      - id
      - is_online
      - phone
      - rating_average
      - rating_count
    DriverCreateRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        phone:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - full_name
      - phone
    DriverLocation:
      type: object
      properties:
        latitude:
          type: number
          format: double
          readOnly: true
        longitude:
          type: number
          format: double
          readOnly: true
        recorded_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - latitude
      - longitude
      - recorded_at
      - updated_at
    DriverPosition:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        recorded_at:
          type: string
          format: date-time
        heading_to:
          $ref: '#/components/schemas/HeadingToEnum'
        distance_km:
          type: number
          format: double
        eta_minutes:
          type: integer
      required:
      - distance_km
      - eta_minutes
      - heading_to
      - latitude
      - longitude
      - recorded_at
    DriverProfileUpdateRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        phone:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - full_name
      - phone
    Error:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    HeadingToEnum:
      enum:
      - pickup
      - dropoff
      type: string
      description: |-
        * `pickup` - pickup
        * `dropoff` - dropoff
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    LocationUpdateRequest:
      type: object
      properties:
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
        recorded_at:
          type: string
          format: date-time
      required:
      - latitude
      - longitude
      - recorded_at
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    MenuItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        price:
          type: integer
          readOnly: true
        is_available:
          type: boolean
          readOnly: true
      required:
      - description
      - id
      - is_available
      - name
      - price
    MenuItemInputRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          default: ''
          maxLength: 500
        price:
          type: integer
          maximum: 10000000
          minimum: 1
        is_available:
          type: boolean
          default: true
      required:
      - name
      - price
    NearbyDriver:
      type: object
      properties:
        driver_id:
          type: integer
        full_name:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        distance_km:
          type: number
          format: double
      required:
      - distance_km
      - driver_id
      - full_name
      - latitude
      - longitude
    NearbyRestaurant:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        is_open:
          type: boolean
        distance_km:
          type: number
          format: double
      required:
      - address
      - distance_km
      - id
      - is_open
      - latitude
      - longitude
      - name
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/OrderStatusEnum'
          readOnly: true
        customer_id:
          type: integer
          readOnly: true
        restaurant:
          allOf:
          - $ref: '#/components/schemas/OrderRestaurant'
          readOnly: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
          readOnly: true
        subtotal:
          type: integer
          readOnly: true
        delivery_fee:
          type: integer
          readOnly: true
        total:
          type: integer
          readOnly: true
        delivery_latitude:
          type: number
          format: double
          readOnly: true
        delivery_longitude:
          type: number
          format: double
          readOnly: true
        delivery_address:
          type: string
          readOnly: true
        note:
          type: string
          readOnly: true
        delivery:
          allOf:
          - $ref: '#/components/schemas/OrderDelivery'
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        accepted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        closed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - accepted_at
      - closed_at
      - created_at
      - customer_id
      - delivery
      - delivery_address
      - delivery_fee
      - delivery_latitude
      - delivery_longitude
      - id
      - lines
      - note
      - restaurant
      - status
      - subtotal
      - total
    OrderCreateRequest:
      type: object
      properties:
        restaurant_id:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemInputRequest'
        delivery_latitude:
          type: number
